<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Nachiket Mendki">
<meta name="description" content="Rounds: a clickable prototype of a case management workbench. Five fictional patients; no real data.">
<title>Rounds | Case Management Workbench prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: clinical work surface — top bar, one working column, a right rail of design notes that can be hidden */
:root{
  --bg:#F3F4F1; --panel:#FCFCFA; --sunk:#E9ECEE; --line:#D3D9DF;
  --ink:#16243A; --muted:#55627A; --faint:#7D8798;
  --accent:#1F5BC6; --accent-soft:#E2EAF8;
  --warn:#A8470E; --warn-soft:#FBE8DA; --warn-line:#D9793B;
  --ok:#0C6B5D; --ok-soft:#D9F0EA;
  --note:#6B4FA0; --note-soft:#EFEAF7;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif;
  --f-mono:"IBM Plex Mono", "Courier New", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1724; --panel:#162131; --sunk:#1D2A3D; --line:#2C3B52;
  --ink:#E8EDF4; --muted:#A9B6C8; --faint:#8592A6;
  --accent:#7FA8F5; --accent-soft:#1E2F4F;
  --warn:#F2A46B; --warn-soft:#3A2416; --warn-line:#C8692D;
  --ok:#6FD3BF; --ok-soft:#123630;
  --note:#BFA8EA; --note-soft:#2A2340; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1724; --panel:#162131; --sunk:#1D2A3D; --line:#2C3B52;
  --ink:#E8EDF4; --muted:#A9B6C8; --faint:#8592A6;
  --accent:#7FA8F5; --accent-soft:#1E2F4F;
  --warn:#F2A46B; --warn-soft:#3A2416; --warn-line:#C8692D;
  --ok:#6FD3BF; --ok-soft:#123630;
  --note:#BFA8EA; --note-soft:#2A2340; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
header.top .brand{font-weight:700;font-size:18px}
header.top .who{font-size:14px;opacity:.85}
header.top .spacer{flex:1}
.badge-proto{font-size:12px;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:4px;padding:2px 8px;opacity:.9}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:700}
.btn.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
header .btn{background:transparent;color:var(--bg);border-color:rgba(255,255,255,.35)}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;
  display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;max-width:1280px;margin:0 auto}
body.nonotes main{grid-template-columns:minmax(0,1fr)}
body.nonotes .rail{display:none}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
.crumbs{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.crumbs a{color:var(--accent)}
h1{font-size:26px;margin:0 0 4px;text-wrap:balance}
h2{font-size:18px;margin:0 0 10px}
.sub{color:var(--muted);font-size:15px;margin:0 0 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:13px;border-radius:999px;padding:3px 10px;border:1px solid var(--line);background:var(--panel);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent;font-weight:700}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent;font-weight:700}
.chip.muted{background:var(--sunk);color:var(--muted);border-color:transparent}
.chip.ai{background:var(--note-soft);color:var(--note);border-color:transparent;font-weight:700}
/* queue */
.qlist{display:flex;flex-direction:column;gap:10px}
.qcard{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;
  grid-template-columns:44px minmax(0,1fr) auto;gap:4px 14px;align-items:start}
.qcard.sev-high{border-left-color:var(--warn-line)}
.qcard.sev-mid{border-left-color:var(--accent)}
.qcard.done{opacity:.6}
.rank{font-family:var(--f-mono);font-size:22px;font-weight:500;color:var(--muted);grid-row:span 3}
.qname{font-weight:700;font-size:17px}
.qname button{background:none;border:0;padding:0;font-weight:700;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.qwhy{color:var(--muted);font-size:15px}
.qright{display:flex;flex-direction:column;gap:6px;align-items:flex-end;grid-row:span 3}
.score{font-family:var(--f-mono);font-size:20px;font-weight:500;background:var(--ink);color:var(--bg);border-radius:6px;padding:2px 10px;border:0}
.breakdown{grid-column:2 / 3;font-size:14px;color:var(--muted);background:var(--sunk);border-radius:6px;padding:8px 10px;display:grid;grid-template-columns:auto auto 1fr;gap:2px 10px}
.breakdown .bar{height:8px;align-self:center;background:var(--accent);border-radius:4px}
/* member */
.strip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:6px 22px;margin-bottom:16px}
.strip .kv{display:flex;flex-direction:column;min-width:0}
.strip .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:700px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tl li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px}
.tl .when{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-top:2px}
.tl .src{font-size:13px;color:var(--faint)}
.tl li.stale{opacity:.6}
.conf{border:2px solid var(--warn-line);background:var(--warn-soft);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.conf h3{margin:0;font-size:16px;color:var(--warn)}
.conf .opt{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;background:var(--panel);border-radius:6px;padding:8px 10px}
.conf .opt .s{font-size:13px;color:var(--muted)}
.conf .opt.pick{grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}
.conf.resolved{border-color:var(--ok);background:var(--ok-soft)}
.conf.resolved h3{color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.nba{background:var(--accent-soft);border-radius:8px;padding:14px 16px;margin-top:16px}
.nba ol{margin:6px 0 12px;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.gap{font-size:15px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:8px 10px}
/* outreach */
.contact{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.contact.dead{opacity:.6}
.contact.dead .num{text-decoration:line-through}
.contact.best{border:2px solid var(--accent)}
.num{font-family:var(--f-mono);font-size:17px}
.field{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.field.pending{color:var(--faint);border-style:dashed}
.field label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.filed{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:12px 14px;font-weight:700}
/* notes rail */
.rail{display:flex;flex-direction:column;gap:12px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.rail h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--note);margin:0}
.dn{background:var(--note-soft);border-radius:8px;padding:10px 12px;font-size:14px}
.dn b{display:block;color:var(--note);margin-bottom:2px}
@media (max-width:900px){.rail{position:static}}
.log{font-size:13px;color:var(--ok);font-family:var(--f-mono)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.reveal{animation:fadein .35s ease}
@keyframes fadein{from{opacity:.2}to{opacity:1}}
</style>
</head>

  contacts:[{num:"(555) 015-3390",src:"Eligibility · Evelyn’s landline (dementia)",conf:"Low",best:"Not the right person to plan with"},
            {num:"(555) 016-7742",src:"Linda · from case notes 25 Oct",conf:"Medium",best:"Call · after 17:00",best1:true}],
  brief:["Fall in October seen only in claims, 18 days late","Meloxicam in CKD stage 4 and amlodipine from two pharmacies","Linda is the real contact; no legal representative on file"],
  note:[["Contact","auto","Call 17:20 · reached Linda · 22 min"],
   ["Authority","confirm","Rep form sent by e-sign; Linda signed during the call"],
   ["Plan","auto","Home-health extension requested · PCP message re meloxicam and amlodipine"],
   ["Caregiver","confirm","Burden screen: high; respite referral accepted"]]}
};

const TARGET = {"Contact":"Audit note: contact attempt","Medication reconciliation":"Assessment: med rec · care plan goal","Barrier":"Care plan: problem",
 "Plan":"Care plan: intervention","Education":"Care plan: intervention (teaching)","Text consent":"Consent record (TCPA)","SDOH":"Assessment: SDOH · Z-code",
 "Hypoglycemia history":"Assessment: symptoms","Housing":"Assessment: SDOH · Z59.01","Coverage":"Care plan: problem (eligibility)","Safety":"Assessment: adherence",
 "Authority":"Consent record: authorized rep","Caregiver":"Assessment: caregiver burden"};
function days(a,b){return Math.round((a-b)/86400000)}
function scoreParts(p){
  const dd = p.dl ? days(p.dl,TODAY) : 30;
  const parts = [
    ["Clinical urgency", W.urgency*p.urg/5, p.urg+"/5"],
    ["Deadline", W.deadline*Math.max(0,7-dd)/7, dd>=30?"none":dd+" d left"],
    ["Risk score", W.risk*p.risk, p.risk.toFixed(2)],
    ["Safety flags", W.safety*Math.min(p.flags,3)/3, p.flags+" flag"+(p.flags===1?"":"s")]];
  return {parts, total: parts.reduce((s,x)=>s+x[1],0)};
}
function ranked(){return Object.keys(P).map(k=>({k,s:scoreParts(P[k]).total})).sort((a,b)=>b.s-a.s)}
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const NOTES = {
 queue:[["Rank, not inbox","Ordered by a visible score. Tap the number to see exactly how it was built."],
  ["Hard windows","Chips show the deadlines the plan is measured on: 2-day post-discharge contact, 7-day follow-up after psychiatric stays, authorization expiry."],
  ["Rules first, ML later","The MVP score is rules a nurse can argue with. Overrides are logged and used to re-tune weights monthly."],
  ["Why Marcus is 4th","Evelyn has a hard deadline and three safety flags. Maria can still move Marcus up because he just left the ED; the override is logged."],
  ["Reach is not rank","Being hard to reach never lowers a member’s rank. The reach chip only decides the channel: call, text, caregiver or community health worker."]],
 member:[["Question order","Who is this, what changed, what doesn’t add up, what do I do. Top to bottom."],
  ["Freshness","Every fact names its source and age. Weeks-old claims are faded and labeled as history."],
  ["Conflicts","Never resolved silently. The nurse picks; the decision is logged for audit."],
  ["Unknown ≠ none","Missing data is shown as unknown, so a blank screen never reads as “no needs”."]],
 note:[["Number confidence","Phone numbers are data with a confidence score, gathered from eligibility, pharmacy claims and past contacts."],
  ["AI drafts, nurse signs","Fields marked auto come from system events. Fields marked confirm came from the conversation and need the nurse."],
  ["One entry, three forms","Signing fills the assessment, the care plan and the audit note. That re-typing costs about 2.5 hours a day today."],
  ["Never unsigned","Nothing is sent to a member or filed without the nurse’s sign-off."]]
};

function renderNotes(kind){
  document.getElementById('rail').innerHTML = '<h2>Design notes</h2>' +
    NOTES[kind].map(n=>'<div class="dn"><b>'+esc(n[0])+'</b>'+esc(n[1])+'</div>').join('');
}

function viewQueue(){
  const r = ranked();
  const filt = state.filter;
  const list = r.filter(({k})=>{
    const p=P[k], dd=p.dl?days(p.dl,TODAY):30;
    if(filt==='due') return dd<=3;
    if(filt==='safety') return p.flags>=2;
    return true;
  });
  let h = '<h1>Who needs me first, and why?</h1><p class="sub">48 active cases · 6 new alerts since Friday · 5 shown, highest priority first</p>';
  h += '<div class="chips" role="group" aria-label="Filter">' +
    [['all','All'],['due','Due within 3 days'],['safety','2+ safety flags']].map(([id,l])=>
      '<button class="chip'+(filt===id?' on':'')+'" data-filter="'+id+'" type="button">'+l+'</button>').join('') + '</div>';
  h += '<div class="qlist">';
  list.forEach(({k,s},i)=>{
    const p=P[k]; const sp=scoreParts(p); const rank=r.findIndex(x=>x.k===k)+1;
    const sev = s>=55?'sev-high':'sev-mid';
    const dlClass = p.dl?'warn':'muted';
    h += '<article class="qcard '+sev+(state.done[k]?' done':'')+'">'+
      '<div class="rank">'+rank+'</div>'+
      '<div class="qname"><button type="button" data-open="'+k+'">'+esc(p.name)+'</button>, '+p.age+' · '+esc(p.scen)+
        (state.done[k]?' <span class="chip ok">Note filed</span>':'')+'</div>'+
      '<div class="qright"><button class="score" type="button" data-break="'+k+'" aria-expanded="'+(!!state.open[k])+'" title="How this score was built">'+Math.round(s)+'</button>'+
        '<span class="chip '+dlClass+'">'+esc(p.dlLabel)+'</span></div>'+
      '<div class="qwhy">'+esc(p.why)+'</div>'+
      '<div class="row"><button class="btn primary" type="button" data-open="'+k+'">→ '+esc(p.act)+'</button><span class="chip '+(p.reachOk?'ok':'muted')+'">Reach: '+esc(p.reachHow)+'</span></div>'+
      (state.open[k]?'<div class="breakdown">'+sp.parts.map(x=>'<span>'+x[0]+'</span><span class="mono">+'+x[1].toFixed(1)+'</span><span class="bar" style="width:'+(x[1]/35*100).toFixed(0)+'%" aria-label="'+esc(x[2])+'"></span>').join('')+
        '<span style="grid-column:1/-1">Inputs: '+sp.parts.map(x=>esc(x[0])+' '+esc(x[2])).join(' · ')+'</span></div>':'')+
      '</article>';
  });
  if(!list.length) h+='<p class="gap">No members match this filter.</p>';
  h += '</div>';
  return h;
}

function viewMember(k){
  const p=P[k]; const d=state.decisions;
  let h = '<div class="crumbs"><a href="#queue">← Queue</a><span>/</span><span>Member 360</span></div>';
  h += '<h1>'+esc(p.name)+', '+p.age+'</h1><p class="sub">'+esc(p.why)+'</p>';
  h += '<div class="strip">'+[["Member ID",'<span class="mono">'+p.id+'</span>'],["Plan",esc(p.plan)],["Language",esc(p.lang)],["PCP",esc(p.pcp)],
    ["Who I may talk to",(p.carerOk?'':'<span class="chip warn">Legal rep not on file</span> ')+esc(p.carer)],
    ["Risk",'<span class="mono">'+p.risk.toFixed(2)+'</span> · '+esc(p.drivers)]].map(x=>'<div class="kv"><span class="k">'+x[0]+'</span><span>'+x[1]+'</span></div>').join('')+'</div>';
  if(p.route){
    h += state.reassigned[k] ? '<p class="filed reveal">Case co-assigned to BH counselor S. Park and social worker T. Ruiz. Maria stays on for medical follow-up.</p>'
      : '<div class="conf" style="margin-bottom:16px"><h3>Routing: this case sits in the medical RN queue</h3><span>Behavioral health and housing needs suggest a BH counselor and a social worker should lead.</span><div class="row"><button class="btn warn" type="button" data-route="'+k+'">Co-assign BH counselor + social worker</button></div></div>';
  }
  h += '<div class="grid2"><div class="panel"><h2>Timeline · newest first</h2><ul class="tl">';
  const tl = p.timeline.slice();
  tl.forEach(t=>{h+='<li class="'+(t[3]?'stale':'')+'"><span class="when">'+esc(t[0])+'</span><span>'+esc(t[1])+'<br><span class="src">'+esc(t[2])+(t[3]?' · faded: old or stale':'')+'</span></span></li>'});
  h += '</ul></div><div class="stack">';
  p.conflicts.forEach(c=>{
    const id=k+'-'+c.key; const done=d[id]!==undefined;
    if(c.merge){
      if(state.decisions[k+'-dupno']) {h+='<div class="conf resolved reveal"><h3>Kept as separate records</h3><span>Flagged to Enrollment for review.</span><span class="log">Decision logged by M. Lopez · 08:11</span></div>';return}
      if(state.merged[k]) h+='<div class="conf resolved reveal"><h3>Records linked in this view</h3><span>Metformin is on time through mail order (supply to 30 Jan). Only glipizide stopped, right after the August low-sugar visit.</span><span class="log">Linked by M. Lopez · 08:11 · sent to Enrollment to confirm the merge</span></div>';
      else h+='<div class="conf"><h3>'+esc(c.title)+'</h3><span>'+esc(c.risk)+'</span>'+c.opts.map(o=>'<div class="opt"><span class="s">'+esc(o[0])+'</span><span>'+esc(o[1])+'</span></div>').join('')+
        '<div class="row"><button class="btn primary" type="button" data-merge="'+k+'">Same person: link in my view</button><button class="btn" type="button" data-merge-no="'+k+'">Not the same</button></div></div>';
      return;
    }
    if(done){
      const pick = d[id]==='pcp' ? 'Sent to the PCP by secure message with both sources and the discharge list · follow-up task in 24 h' : 'Verified on call: '+c.opts[d[id]][1];
      h+='<div class="conf resolved reveal"><h3>'+esc(c.title)+'</h3><span>'+esc(pick)+'</span><span class="log">Decision logged by M. Lopez · 08:14</span></div>';
    } else {
      h+='<div class="conf"><h3>'+esc(c.title)+' · sources disagree</h3><span>'+esc(c.risk)+'</span>'+
        c.opts.map((o,i)=>'<div class="opt pick"><div><span class="s">'+esc(o[0])+'</span><br><span>'+esc(o[1])+'</span></div><button class="btn" type="button" data-pick="'+id+'" data-i="'+i+'">Verified on call</button></div>').join('')+
        '<div class="row"><button class="btn warn" type="button" data-pick="'+id+'" data-i="pcp">Ask PCP / pharmacist</button></div></div>';
    }
  });
  p.gaps.forEach(g=>{h+='<div class="gap">Gap · '+esc(g)+'</div>'});
  h += '</div></div>';
  h += '<div class="nba"><h2>Next best actions</h2><ol>'+p.nba.map((n,i)=>{const id=k+'-'+i;return '<li><label><input type="checkbox" id="nba-'+id+'" data-nba="'+id+'"'+(state.nba[id]?' checked':'')+'> '+esc(n)+'</label></li>'}).join('')+'</ol>'+
    '<div class="row"><a class="btn primary" href="#note-'+k+'">Start outreach →</a><span class="chip muted">Rules: '+(k==='p1'?'rejected fill + pending PA → escalate PA':'deadline + gap → book the visit first')+'</span></div></div>';
  return h;
}

function viewNote(k){
  const p=P[k]; const c=state.call[k]||0; const conf=state.confirm;
  let h = '<div class="crumbs"><a href="#queue">← Queue</a><span>/</span><a href="#member-'+k+'">'+esc(p.name)+'</a><span>/</span><span>Outreach &amp; note</span></div>';
  h += '<h1>Reach '+esc(p.name.split(' ')[0])+'</h1><p class="sub">Ranked numbers on the left, the AI draft on the right. The nurse signs.</p>';
  h += '<div class="grid2"><div class="stack"><h2>Best way to reach '+esc(p.name.split(' ')[0])+'</h2>';
  p.contacts.forEach(ct=>{h+='<div class="contact'+(ct.dead?' dead':'')+(ct.best1?' best':'')+'"><span class="num">'+esc(ct.num)+'</span><span class="src" style="font-size:14px;color:var(--muted)">'+esc(ct.src)+'</span><div class="row"><span class="chip '+(ct.dead?'warn':ct.conf==='High'?'ok':'muted')+'">'+esc(ct.conf)+'</span><span style="font-size:14px">'+esc(ct.best)+'</span></div></div>'});
  h += '<div class="panel"><h2>Pre-call brief <span class="chip ai">AI · linked to sources</span></h2><ul style="margin:0;padding-left:20px">'+p.brief.map(b=>'<li>'+esc(b)+'</li>').join('')+'</ul></div></div>';
  h += '<div class="stack"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Call note</h2><span class="chip ai">AI draft · nurse confirms</span></div>';
  if(!c && !state.done[k]) h += '<div class="gap">No call yet. The draft fills in from the call log, the scheduler and the conversation.</div><div class="row"><button class="btn primary" type="button" data-call="'+k+'">Log the call (demo)</button></div>';
  p.note.forEach((f,i)=>{
    const shown = state.done[k] || i < c; const id=k+'-'+i;
    if(!shown){h+='<div class="field pending"><b>'+esc(f[0])+'</b><span>Waiting for the call…</span></div>';return}
    h+='<div class="field reveal"><div class="row" style="justify-content:space-between"><b>'+esc(f[0])+'</b><span class="chip '+(f[1]==='auto'?'ok':'warn')+'">'+(f[1]==='auto'?'auto · from system event':'confirm · from conversation')+'</span></div><span>'+esc(f[2])+'</span><span style="font-size:13px;color:var(--faint)">→ writes to '+esc(TARGET[f[0]]||'Assessment')+'</span>'+
      (f[1]==='confirm'?'<label><input type="checkbox" id="cf-'+id+'" data-confirm="'+id+'"'+(conf[id]||state.done[k]?' checked':'')+(state.done[k]?' disabled':'')+'> I confirm this is what the member said</label>':'')+'</div>';
  });
  if(state.done[k]){
    h+='<p class="filed reveal">Signed and filed as structured fields in the assessment, the care plan (problem → goal → intervention) and the audit note'+(k==='p1'?' · reconciled medication list sent to the PCP for the outpatient record':'')+' · M. Lopez · 10:58</p><div class="row"><a class="btn primary" href="#queue">Back to the queue</a></div>';
  } else if(c>=p.note.length){
    const need = p.note.map((f,i)=>f[1]==='confirm'?k+'-'+i:null).filter(Boolean);
    const left = need.filter(id=>!conf[id]).length;
    h+='<div class="row"><button class="btn primary" type="button" data-sign="'+k+'"'+(left?' disabled':'')+'>Sign and file to 3 forms</button><span style="font-size:14px;color:var(--muted)">'+(left?left+(left===1?' field still needs':' fields still need')+' your confirmation':'Ready to sign')+'</span></div>';
  }
  h += '</div></div>';
  return h;
}

function route(){
  const hsh = location.hash.replace('#','');
  const v = document.getElementById('view');
  let m;
  if((m=hsh.match(/^member-(p[1-5])$/))){v.innerHTML=viewMember(m[1]);renderNotes('member')}
  else if((m=hsh.match(/^note-(p[1-5])$/))){v.innerHTML=viewNote(m[1]);renderNotes('note')}
  else {v.innerHTML=viewQueue();renderNotes('queue')}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  const ds=t.dataset;
  if(ds.open){location.hash='member-'+ds.open;window.scrollTo(0,0);return}
  if(ds.filter){state.filter=ds.filter;route();return}
  if(ds.break){state.open[ds.break]=!state.open[ds.break];route();return}
  if(ds.pick){state.decisions[ds.pick]=ds.i==='pcp'?'pcp':Number(ds.i);route();return}
  if(ds.merge){state.merged[ds.merge]=true;route();return}
  if(ds.mergeNo){state.decisions[ds.mergeNo+'-dupno']=1;route();return}
  if(ds.route){state.reassigned[ds.route]=true;route();return}
  if(ds.call){const k=ds.call;let i=0;const n=P[k].note.length;const step=()=>{i++;state.call[k]=i;route();if(i<n)setTimeout(step,450)};step();return}
  if(ds.sign){state.done[ds.sign]=true;route();return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.nba){state.nba[t.dataset.nba]=t.checked}
  if(t.dataset.confirm){state.confirm[t.dataset.confirm]=t.checked;route()}
});
const tog=document.getElementById('toggleNotes');
tog.addEventListener('click',()=>{const off=document.body.classList.toggle('nonotes');tog.textContent=off?'Show design notes':'Hide design notes';tog.setAttribute('aria-pressed',String(!off))});
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
